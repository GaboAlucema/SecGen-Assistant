version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secgen-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - secgen-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secgen-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - secgen-network

networks:
  secgen-network:
    driver: bridge

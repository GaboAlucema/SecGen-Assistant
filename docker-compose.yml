version: '3.8'

services:
  backend:
    build: ./backend
    container_name: secgen_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - secgen-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: secgen_frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - secgen-network
    restart: unless-stopped

networks:
  secgen-network:
    driver: bridge
